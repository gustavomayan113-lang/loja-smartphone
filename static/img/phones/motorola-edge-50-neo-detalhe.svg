<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720" role="img" aria-label="Motorola Edge 50 Neo detalhe das câmeras">
  <defs>
    
  <radialGradient id="aro" cx="35%" cy="28%" r="80%">
