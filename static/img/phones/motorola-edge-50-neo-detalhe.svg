  <rect x="70.75" y="52.75" width="578.5" height="614.5" rx="85" fill="none" stroke="url(#borda-motorola-edge-50-neo)" stroke-width="2"/>

  <g transform="translate(346 300) rotate(-6) scale(2.05) translate(-300 -205)">
    
        <g>
          <rect x="234" y="139" width="132" height="132"
            rx="38" fill="url(#plataforma)"/>
          
    <g class="lente">
      <circle cx="270" cy="175" r="38" fill="url(#aro)" opacity="0.95"/>
      <circle cx="270" cy="175" r="33" fill="#0a0d12"/>
      <circle cx="270" cy="175" r="30" fill="url(#vidro)"/>
      <circle cx="270" cy="175" r="17.4" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/>
      <circle cx="270" cy="175" r="9" fill="rgba(8,12,18,0.9)"/>
      <ellipse cx="259.8" cy="162.4" rx="9" ry="5.7"
        fill="rgba(255,255,255,0.5)" transform="rotate(-32 270 175)"/>
    </g>
          
    <g class="lente">
      <circle cx="330" cy="235" r="38" fill="url(#aro)" opacity="0.95"/>
      <circle cx="330" cy="235" r="33" fill="#0a0d12"/>
      <circle cx="330" cy="235" r="30" fill="url(#vidro)"/>
      <circle cx="330" cy="235" r="17.4" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/>
      <circle cx="330" cy="235" r="9" fill="rgba(8,12,18,0.9)"/>
      <ellipse cx="319.8" cy="222.4" rx="9" ry="5.7"
